name: Daily Contract Digest

on:
  schedule:
    # 23:00 UTC (Sun-Thu) = 01:00 CEST (Mon-Fri) Stockholm night
    - cron: '0 23 * * 0-4'
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write  # needed to commit the digest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        # Needed to render JS-heavy broker portals marked as "playwright" in state/portals.json
        run: python -m playwright install --with-deps chromium

      - name: Restore seen state
        # seen.json is committed to the repo so it persists across runs
        run: echo "State file exists:" && (test -f state/seen.json && echo "yes" || echo "no, will create fresh")

      - name: Run scraper
        env:
          # Gemini via the OpenAI-compatible endpoint (GitHub Models retired 2026-07-30)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main.py

      - name: Commit digest
        # always() so the digest and state files are committed even when main.py exits 1
        # (degraded run: the LLM classification produced nothing). The job still goes red.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ state/seen.json state/classifications.json state/portal_pages.json
          git diff --staged --quiet && echo "no_changes=true" >> "$GITHUB_ENV" || true
          git diff --staged --quiet || git commit -m "chore: daily digest $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push

      # The success email (with the actual new assignments) is sent from Python
      # in the "Run scraper" step. Here we only mail if the run failed.
      - name: Email on failure
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -m src.notify --failure \
            "Se loggen: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
